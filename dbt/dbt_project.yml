name: retail_dw
version: 1.0.0
profile: retail_dw
model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  retail_dw:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      dim_date:
        +materialized: table
      fact_orders:
        +materialized: incremental

snapshots:
  retail_dw:
    +target_schema: snapshots
    +strategy: timestamp
    +updated_at: ingested_at

seeds:
  retail_dw:
    +schema: raw
    +database: RAW_DB
    customers:
      +alias: RAW_CUSTOMERS
      +column_types:
        customer_id: varchar
        signup_date: date
        customer_tier: varchar
    orders:
      +alias: RAW_ORDERS
      +column_types:
        order_id: varchar
        order_date: date
        unit_price: float
        discount_pct: float
        quantity: integer
    products:
      +alias: RAW_PRODUCTS
      +column_types:
        product_id: integer
        price: float
        rating_rate: float
        rating_count: integer
